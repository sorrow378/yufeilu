function buildMessages(userInput){

    msgs.push({ role:'system', content: STAGES[state.stage] });

  const hit = WORLDBOOK.filter(e =>
    e.keys.some(k => userInput.includes(k) || (state.location||'').includes(k)));
  if (hit.length)
    msgs.push({ role:'system', content: hit.map(e=>e.content).join('\n\n') });

  const npcs = (state.present||[]).map(n=>NPC_FULL[n]).filter(Boolean);
  if (npcs.length)
    msgs.push({ role:'system', content: npcs.join('\n\n') });

  if (state.todayLesson && LESSONS[state.todayLesson])
    msgs.push({ role:'system', content:'【今日申时课目】'+LESSONS[state.todayLesson] });

  msgs.push({ role:'system', content:'【当前状态】\n'+JSON.stringify({
    day: state.day, time: state.time, stage: state.stage,
    location: state.location, stamina: state.stamina,
    present: state.present||[], todayLesson: state.todayLesson,
    containing: state.containing,
    npc: Object.fromEntries(Object.entries(state.npc).map(([k,v])=>[k,v.favor])),
  }) });

  msgs.push(...state.history.slice(-6));
  msgs.push({ role:'user', content: userInput });
  return msgs;
}

/* ═════ 调 API ═════ */
async function callAI(userInput){
  const res = await fetch(CONFIG.apiUrl, {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization': 'Bearer ' + CONFIG.apiKey,
    },
    body: JSON.stringify({
      model: CONFIG.model,
      messages: buildMessages(userInput),
      temperature: 0.9,
      stream: false,
    }),
  });
  if (!res.ok) throw new Error(await res.text());

  const j = await res.json();
  const raw = j.choices?.[0]?.message?.content || '';
  const finish = j.choices?.[0]?.finish_reason || '';
  console.log('=== AI 原始输出 ===', raw);
  console.log('=== finish_reason ===', finish, '长度:', raw.length);

  if (!raw.trim()){
    throw new Error('返回为空。finish_reason=' + finish + '。可能被内容过滤了。');
  }

  return parseText(raw);
}

/* ═════ 纯文本解析器 ═════ */
function parseText(text){
  let body = '';
  let options = [];
  let patch = {};

  // 抓【正文】
  const bodyM = text.match(/【正文】([\s\S]*?)(?=【选项】|【状态】|$)/);
  if (bodyM) body = bodyM[1].trim();

  // 抓【选项】
  const optM = text.match(/【选项】([\s\S]*?)(?=【状态】|$)/);
  if (optM){
    const lines = optM[1].split('\n').map(l => l.trim()).filter(Boolean);
    for (const line of lines){
      const m = line.match(/^([A-D])[.、．\s]\s*(.+)$/);
      if (m) options.push({ k: m[1], text: m[2].trim() });
    }
  }

  // 抓【状态】
  const stM = text.match(/【状态】([\s\S]*?)$/);
  if (stM){
    const lines = stM[1].split('\n').map(l => l.trim()).filter(Boolean);
    for (const line of lines){
      const m = line.match(/^([a-zA-Z_]+)\s*[:：]\s*(.+)$/);
      if (!m) continue;
      const key = m[1];
      const val = m[2].trim();
      if (key === 'time') patch.time = val;
      else if (key === 'location') patch.location = val;
      else if (key === 'containing') patch.containing = (val === 'true' || val === '是');
      else if (key === 'stamina') patch.stamina = parseInt(val) || 0;
      else if (key === 'todayLesson') patch.todayLesson = parseInt(val);
      else if (key === 'log') patch.log = val;
      else if (key.startsWith('favor_')){
        const name = key.slice(6);
        const dv = parseInt(val) || 0;
        patch.favor = patch.favor || {};
        patch.favor[name] = dv;
      }
      else if (key === 'present'){
        patch.present = val.split(/[,，、\s]+/).filter(Boolean);
      }
    }
  }

  // 兜底
  if (!body){
    // 完全没按格式——整个文本当正文
    body = text.trim();
  }
  if (!options.length){
    options = [
      {k:'A', text:'继续深入'},
      {k:'B', text:'换个人'},
      {k:'C', text:'换个姿势'},
      {k:'D', text:'重新生成本回合'}
    ];
  }

  return { body, options, state: patch };
}

function applyPatch(p){
  if (!p) return;
  if (p.time)        state.time = p.time;
  if (p.location)    state.location = p.location;
  if (p.stage)       state.stage = p.stage;
  if (p.present)     state.present = p.present;
  if (p.todayLesson) state.todayLesson = p.todayLesson;
  if (typeof p.containing === 'boolean') state.containing = p.containing;
  if (p.stamina)     state.stamina = Math.max(0, Math.min(100, state.stamina + p.stamina));
  if (p.favor){
    for (const [n, dv] of Object.entries(p.favor)){
      if (state.npc[n]){
        state.npc[n].favor = Math.max(0, Math.min(100, state.npc[n].favor + dv));
        toast(`${n} 好感 ${dv>0?'+':''}${dv}`);
      }
    }
  }
  if (p.log){
    state.history.push({ role:'system', content:'【前情】'+p.log });
    const sysIdx = [];
    state.history.forEach((h,i) => { if (h.role==='system') sysIdx.push(i); });
    if (sysIdx.length > 5){
      state.history.splice(sysIdx[0], 1);
    }
  }
  renderStat();
}

/* ═════ 界面 ═════ */
const logEl     = document.getElementById('log');
const statEl    = document.getElementById('stat');
const optEl     = document.getElementById('options');
const loadingEl = document.getElementById('loading');
const keyModal  = document.getElementById('keyModal');
const keyInp    = document.getElementById('keyInp');

function bubble(cls, text){
  const d = document.createElement('div');
  d.className = cls; d.textContent = text;
  logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
  return d;
}

function renderStat(){
  const fav = Object.entries(state.npc)
    .filter(([_,v]) => v.favor >= 60)
    .map(([k,v]) => `${k} ${v.favor}`).join(' · ');
  statEl.querySelector('.l1').textContent =
    `第${state.day}日 ${state.time} · ${state.location} · 体力${state.stamina}`;
  statEl.querySelector('.l2').textContent = fav || '';
}

function renderOptions(opts){
  optEl.innerHTML = '';
  if (!opts || !opts.length){
    const b = document.createElement('button');
    b.className = 'opt reload';
    b.textContent = '重新生成本回合';
    b.onclick = () => step('【系统】请按格式重新输出本回合，必须包含【正文】【选项】【状态】三段。');
    optEl.appendChild(b);
    return;
  }
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="k">${o.k||''}</span><span>${o.text}</span>`;
    b.onclick = () => step(o.text);
    optEl.appendChild(b);
  });
}

function lockOptions(v){
  optEl.querySelectorAll('.opt').forEach(b => b.disabled = v);
}

function toast(msg){
  const t = document.createElement('div');
  t.style.cssText = `position:fixed;top:80px;left:50%;transform:translateX(-50%);
    background:#3a3026;color:#d8cfc0;padding:8px 14px;border-radius:8px;
    font-size:13px;z-index:99;pointer-events:none`;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

function typewrite(el, text, speed){
  return new Promise(resolve => {
    el.textContent = '';
    let i = 0;
    const step = 3;
    const timer = setInterval(() => {
      if (i >= text.length){
        clearInterval(timer);
        resolve();
        return;
      }
      el.textContent += text.slice(i, i + step);
      i += step;
      logEl.scrollTop = logEl.scrollHeight;
    }, speed || 14);
  });
}

/* ═════ 主流程 ═════ */
let busy = false;
let waitingTimer = null;

async function step(userText){
  if (busy) return;
  if (!CONFIG.apiKey){ openKeyModal(); return; }

  busy = true;
  lockOptions(true);
  optEl.innerHTML = '';

  let waited = 0;
  loadingEl.textContent = 'AI 正在生成…';
  loadingEl.classList.add('on');
  clearInterval(waitingTimer);
  waitingTimer = setInterval(() => {
    waited++;
    loadingEl.textContent = `AI 正在生成…已等 ${waited} 秒`;
  }, 1000);

  bubble('user', userText);
  const aiEl = bubble('ai', '');

  try {
    const parsed = await callAI(userText);
    clearInterval(waitingTimer);
    loadingEl.classList.remove('on');

    const { body, options, state: patch } = parsed;

    await typewrite(aiEl, body, 14);

    applyPatch(patch);
    state.history.push({ role:'user', content: userText });
    state.history.push({ role:'assistant', content: body });

    state.options = options;
    renderOptions(options);
    saveState();

  } catch (e){
    clearInterval(waitingTimer);
    loadingEl.classList.remove('on');
    aiEl.textContent = '【出错】' + e.message;
    renderOptions(null);
  }

  busy = false;
  lockOptions(false);
  logEl.scrollTop = logEl.scrollHeight;
}

document.addEventListener('keydown', e => {
  const i = 'abcd'.indexOf(e.key.toLowerCase());
  if (i >= 0){
    const b = optEl.querySelectorAll('.opt')[i];
    if (b && !b.disabled) b.click();
  }
});

function openKeyModal(){
  keyModal.classList.remove('hide');
  keyInp.value = CONFIG.apiKey || '';
}
keyModal.onclick = e => { if (e.target === keyModal) keyModal.classList.add('hide'); };
document.getElementById('keySave').onclick = () => {
  const k = keyInp.value.trim();
  if (!k) return;
  CONFIG.apiKey = k;
  try{ localStorage.setItem(KEY_KEY, k); }catch(e){}
  keyModal.classList.add('hide');
  if (!state.history.length) startNewGame();
};

function startNewGame(){
  bubble('sys', '—— 东宫 · 卯时 ——');
  step('【开局】卯时，太傅谢霁舟入寝殿，令侍读江砚跪伏榻前补置晨省玉器，亲自在旁查验含器。直接开始，不要铺垫。');
}

function boot(){
  loadState();
  renderStat();

  const saved = localStorage.getItem(KEY_KEY);
  if (saved) CONFIG.apiKey = saved;
  else { openKeyModal(); return; }

  if (state.history.length === 0){
    startNewGame();
  } else {
    state.history.slice(-6).forEach(h => {
      if (h.role === 'system') bubble('sys', h.content);
      else bubble(h.role === 'user' ? 'user' : 'ai', h.content);
    });
    if (state.options) renderOptions(state.options);
    else step('【继续】');
  }
}

boot();
</script>
